<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: blob: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' file: 'unsafe-inline'; connect-src 'self' blob: data:; img-src data: blob:; media-src blob: data:; worker-src blob:; base-uri 'none'; object-src 'none'">
<title>Counter-Strike 1.6</title>
<link rel="stylesheet" href="launcher.css?v=1.5.0">
</head>
<body>
<main id="setup">
<nav class="topbar" aria-label="Launcher"><span class="brand">CS<span>/</span>16</span><label class="language"><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label></nav>
<div class="layout">
<section class="identity" aria-label="Counter-Strike 1.6"><div class="edition">COUNTER-STRIKE</div><h1>COUNTER<br>STRIKE<span class="accent">.</span></h1><div class="version" aria-hidden="true">1.6<span class="crosshair"></span></div></section>
<section class="match-panel">
<div class="panel-heading"><h2 data-i18n="match">New match</h2><span class="panel-mark" aria-hidden="true">01 / CS</span></div>
<fieldset id="settings"><legend class="sr-only" data-i18n="match">New match</legend>
<label class="field full"><span data-i18n="map">Map</span><select id="map"><option value="de_dust2">Dust II</option><option value="de_dust">Dust</option></select></label>
<label class="field"><span data-i18n="bots">Bots</span><select id="bots"><option value="0" data-i18n="none">None</option><option value="3">3</option><option value="7" selected>7</option><option value="11">11</option></select></label>
<label class="field"><span data-i18n="difficulty">Difficulty</span><select id="difficulty"><option value="0" data-i18n="easy">Easy</option><option value="1" selected data-i18n="normal">Normal</option><option value="2" data-i18n="hard">Hard</option></select></label>
<label class="field full"><span data-i18n="player">Player name</span><input id="player" value="Player" maxlength="24" autocomplete="off" spellcheck="false"></label>
</fieldset>
<button id="start" disabled data-i18n="start">Start game</button>
<div class="loading-row"><span id="status" role="status" aria-live="polite">Checking files</span><button class="logs-button icon-button" type="button" title="Logs" aria-label="Logs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 7 5 5-5 5M13 17h6"/></svg></button></div>
<progress id="progress" max="100" value="0" aria-label="Loading progress"></progress>
</section></div>
<div class="bottom-rule" aria-hidden="true"><span>CS / 1.6</span><span>●</span></div>
</main>
<header id="toolbar"><span class="brand">CS<span>/</span>16</span><span id="game-state"></span>
<button id="fullscreen" class="icon-button" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
<button id="restart" class="icon-button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg></button>
<button class="logs-button icon-button" title="Console" aria-label="Console"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 7 5 5-5 5M13 17h6"/></svg></button>
</header>
<canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Game"></canvas>
<section id="console-panel" aria-label="Console"><pre id="log"></pre><form id="command-form"><input id="command" placeholder="Command" autocomplete="off" aria-label="Command"><button type="submit">Run</button><button id="close-console" type="button">Close</button></form></section>
<script src="i18n.js?v=1.5.0"></script>
<script src="static-libraries.js?v=1.4.0"></script>
<script src="launcher.js?v=1.5.0"></script>
</body>
</html>
